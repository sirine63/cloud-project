<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload System</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .box {
        width: 400px;
        padding: 20px;
        background: #1e293b;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .drop-zone {
        border: 2px dashed #38bdf8;
        padding: 30px;
        border-radius: 10px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background 0.2s ease;
      }

      .drop-zone.dragover {
        background: #334155;
      }

      input[type="file"] {
        display: none;
      }

      button {
        background: #38bdf8;
        color: #0f172a;
        font-weight: bold;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        font-size: 16px;
      }

      button:hover {
        background: #7dd3fc;
      }

      /* Fixed download button styling rules */
      #download-btn {
        display: none; /* Hidden by default */
        margin-top: 20px;
        padding: 12px 20px;
        background-color: #22c55e;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        /* Because the parent .box has text-align: center, this centers it automatically */
        display: none;
      }

      #download-btn:hover {
        background-color: #16a34a;
      }

      .progress {
        width: 100%;
        background: #334155;
        border-radius: 10px;
        margin-top: 15px;
        overflow: hidden;
      }

      .bar {
        height: 10px;
        width: 0%;
        background: #22c55e;
        transition: width 0.2s ease;
      }

      #result {
        margin-top: 15px;
        font-size: 14px;
        color: #a7f3d0;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>📤 Upload File</h2>

      <div class="drop-zone" id="dropZone">Drag & Drop file here or click</div>
      <input type="file" id="fileInput" accept="image/*" />

      <button onclick="uploadFile()">Upload</button>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>

      <a id="download-btn" href="#" download> 📥 Download Resized Image </a>

      <div id="result"></div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const bar = document.getElementById("bar");
      const result = document.getElementById("result");
      const downloadBtn = document.getElementById("download-btn");

      let file = null;

      /* CLICK to select file */
      dropZone.onclick = () => fileInput.click();

      fileInput.onchange = (e) => {
        file = e.target.files[0];
        if (file) dropZone.innerText = file.name;
      };

      /* DRAG & DROP RULES */
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        file = e.dataTransfer.files[0];
        if (file) dropZone.innerText = file.name;
      });

      /* UPLOAD ACTION */
      function uploadFile() {
        if (!file) {
          alert("Please select a file first!");
          return;
        }

        // Reset elements on a new upload attempt
        downloadBtn.style.display = "none";
        bar.style.width = "0%";
        result.innerText = "Uploading...";

        const formData = new FormData();
        formData.append("image", file);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "http://localhost:3000/upload");

        // Tracks upload progress to backend
        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            const percent = (event.loaded / event.total) * 100;
            bar.style.width = percent + "%";
          }
        };

        xhr.onload = () => {
          try {
            const res = JSON.parse(xhr.responseText);
            const jobId = res.jobId;
            result.innerText = "⏳ Processing image ...";

            // Start polling the backend for job completion
            const interval = setInterval(async () => {
              const r = await fetch(`http://localhost:3000/status/${jobId}`);
              const data = await r.json();

              // Update the visual loading bar based on background task progress
              bar.style.width = (data.progress || 0) + "%";

              if (data.status === "done") {
                clearInterval(interval);

                const fileUrl = `http://localhost:3000/download/${data.file}`;

                // 1. Update the link path
                downloadBtn.href = fileUrl;

                // 2. Reveal it as an inline-block element
                downloadBtn.style.display = "inline-block";

                result.innerHTML = `
    ✅ DONE! <br/><br/>
    <img src="${fileUrl}" width="200" style="border-radius: 8px; border: 1px solid #334155;"/>
  `;
              }
            }, 1000);
          } catch (e) {
            console.error("Backend response parse error:", xhr.responseText);
            result.innerText = "❌ Upload failed (backend error)";
          }
        };

        xhr.send(formData);
      }
    </script>
  </body>
</html>
